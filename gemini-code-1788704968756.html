<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メールテンプレート管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #f3f4f6; color: #374151; font-family: 'Helvetica Neue', Arial, sans-serif; }
    .fade-enter-active, .fade-leave-active { transition: opacity 0.3s ease; }
    .fade-enter-from, .fade-leave-to { opacity: 0; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen pb-6">
    <header class="bg-gray-900 text-white shadow-md sticky top-0 z-10">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-12 flex items-center justify-between">
        <h1 class="text-base font-bold tracking-wider"><i class="fa-regular fa-envelope mr-2"></i>メールテンプレート</h1>
        <button @click="addNewTemplate" class="bg-indigo-500 hover:bg-indigo-600 text-white px-3 py-1.5 rounded-md shadow transition duration-200 text-xs font-semibold">
          <i class="fa-solid fa-plus mr-1"></i> 新規作成
        </button>
      </div>
    </header>

    <transition name="fade">
      <div v-if="toastMsg" class="fixed top-16 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full shadow-lg z-50 flex items-center text-sm w-max">
        <i class="fa-solid fa-check-circle text-green-400 mr-2"></i> {{ toastMsg }}
      </div>
    </transition>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 mt-4">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <div v-for="(tpl, index) in templates" :key="tpl.id" class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col">
          
          <!-- 表示モード -->
          <div v-if="editingId !== tpl.id" class="flex flex-col h-full">
            <div class="bg-gray-50 px-3 py-2 border-b border-gray-200 flex justify-between items-center">
              <h2 class="text-sm font-bold text-gray-800 truncate">{{ tpl.title }}</h2>
              <button @click="startEdit(tpl)" class="text-gray-400 hover:text-indigo-500 transition p-1" title="編集">
                <i class="fa-solid fa-pen text-xs"></i>
              </button>
            </div>
            
            <div class="p-2.5 flex-grow">
              <div class="text-xs text-gray-700 whitespace-pre-wrap leading-relaxed h-32 overflow-y-auto bg-gray-50 p-2 rounded border border-gray-100">{{ tpl.content }}</div>
            </div>
            
            <div class="px-2.5 pb-2.5">
              <button @click="copyText(tpl.content)" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-3 rounded-md shadow-sm transition duration-200 flex justify-center items-center text-sm">
                <i class="fa-regular fa-copy mr-1.5"></i> コピー
              </button>
            </div>
          </div>

          <!-- 編集モード -->
          <div v-else class="flex flex-col h-full bg-indigo-50">
            <div class="px-3 pt-3 pb-1.5">
              <label class="block text-[10px] font-bold text-indigo-700 mb-0.5">タイトル</label>
              <input v-model="editForm.title" type="text" class="w-full border-gray-300 rounded shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-1.5 text-sm" placeholder="メールの種類">
            </div>
            
            <div class="px-3 pb-1.5 flex-grow">
              <label class="block text-[10px] font-bold text-indigo-700 mb-0.5">本文</label>
              <textarea v-model="editForm.content" class="w-full border-gray-300 rounded shadow-sm focus:ring-indigo-500 focus:border-indigo-500 p-2 h-32 text-xs leading-relaxed" placeholder="メールの本文を入力"></textarea>
            </div>
            
            <div class="px-3 pb-3 pt-1 flex justify-between items-center space-x-2">
              <button @click="deleteTemplate(index)" class="text-red-500 hover:bg-red-100 p-1.5 rounded transition" title="削除">
                <i class="fa-solid fa-trash text-sm"></i>
              </button>
              <div class="flex space-x-2">
                <button @click="cancelEdit" class="bg-gray-200 hover:bg-gray-300 text-gray-700 font-semibold py-1.5 px-3 rounded text-xs transition duration-200">キャンセル</button>
                <button @click="saveEdit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-1.5 px-4 rounded shadow-sm text-xs transition duration-200">保存</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script>
    const { createApp, ref, onMounted } = Vue;

    const defaultTemplates = [
      { id: 1, title: "注文確定", content: "この度は、ご購入誠にありがとうございます！\n\nご希望の号数・カラーを本商品ページの「商品説明」の中からお選びいただきご返信いただけますでしょうか。\nどうぞ宜しくお願いいたします。" },
      { id: 2, title: "発送完了メール", content: "お世話になっております！\n\nお待たせいたしました。\n商品を出荷いたしました(^^)\n\n※定形郵便のため、土日祝の配達はございません。\n到着まで今しばらくお待ちくださいませ。\nどうぞ宜しくお願いいたします！" },
      { id: 3, title: "shops値引き不可", content: "お問い合わせありがとうございます。\n\n当メルカリshopsでは手続き上、1点づつのご購入をお願いしております。\nご希望に添えず申し訳ございません。\n何卒よろしくお願いいたします。" },
      { id: 4, title: "在庫切れ", content: "お世話になっております。\n発送お待たせしており申し訳ございません。\n\n商品の梱包を行っていましたところ、一部塗装ムラが見つかりました。\n管理不足でご迷惑お掛けし誠に申し訳ございません。\n\n〇月〇日頃に使用している材料の入荷の予定があり、お待ちいただくことは可能でしょうか。\n※発送前まではいつでもキャンセル可能です。\n何卒よろしくお願いいたします。" },
      { id: 5, title: "配送遅延", content: "お世話になっております。\nお待たせしてしまい大変申し訳ございません。\n\n配送につきましては、説明文に記載の通り大阪府より普通郵便にてお送りさせていただきました。\n土日祝の配達がないため、もうしばらくお待ちいただけますでしょうか。\n未着や破損の場合は、しっかりと対応させていただきます。\nご迷惑お掛けしますが、何卒よろしくお願いいたします。" },
      { id: 6, title: "PayPay同封", content: "お世話になっております。\n\nこちらの商品ページは同封の都合上、受け取りボタンが時間経過で自動的に取引完了になりますので、このまま放置していただきますようお願い申し上げます。\n※普通郵便の商品は同封してお送りさせていただきます。\nどうぞよろしくお願いいたします。" },
      { id: 7, title: "shops-低評価キャンセル", content: "お世話になっております。\nこの度は、ご不便おかけし申し訳ございません。\n\nいただいたご意見は真摯に受け止め、今後のストア運営に活かして参ります。\nなお、本ご注文に限り、特例としてキャンセル(全額返金)とさせていただきます。\n商品のご返送等は不要です。\nどうぞよろしくお願いいたします。" },
      { id: 8, title: "返品・交換・お断り", content: "お世話になっております。\nサイズにつきましてご不便をおかけし、申し訳ございません。\n\n指輪のサイズに関しまして、当店では国内基準に基づき検品・計測を行ったうえで、お届けしております。\nただし、リングサイズは計測方法の違いや製造国の基準違いにより着用時の体感的な違いが生じる場合がございます。\nご理解いただけますと幸いです。\n\nこの度はご満足いただけなかったこと、心よりお詫び申し上げます。\n何卒よろしくお願い申し上げます。" },
      { id: 9, title: "交換-了承", content: "お世話になっております。\n\nサイズ交換対応しております。\n恐れ入りますが、返送料及びこちらからの再発送料220円はお客様負担となります。\n宜しければ、以下ご住所へ再発送用の110円切手を同封のうえご返送くださいませ。\n\n〒596-0806\n大阪府岸和田市摩湯町636-1\nGlory Family205\n宛先:AOI Jewel\n\nどうぞよろしくお願いいたします。" },
      { id: 10, title: "コーティング説明", content: "お問い合わせありがとうございます。\n\n<コーティングについて>\n①金属に軽度のアレルギー体質をお持ちの方\n・アレルギー専用コーティング剤で肌を守ります。\n\n②商品をより長く大切にしたい方\n・つけっぱなしにしていたら、仕舞っておいただけなのにいつのまにか変色...ということを防ぎます。\n\n<特徴>\n・無臭\n・外観に変化はありません\n・皮膚への有毒性はありません(JIS認証済み)\n\nその他サービスについて気になることがございましたら、お気軽にお問い合わせください。\nよろしくお願いいたします。" }
    ];

    createApp({
      setup() {
        const templates = ref([]);
        const toastMsg = ref('');
        const editingId = ref(null);
        const editForm = ref({ id: null, title: '', content: '' });

        onMounted(() => {
          const saved = localStorage.getItem('mail_templates');
          if (saved) {
            try { templates.value = JSON.parse(saved); } catch(e) { templates.value = defaultTemplates; }
          } else {
            templates.value = defaultTemplates;
          }
        });

        const showToast = (msg) => {
          toastMsg.value = msg;
          setTimeout(() => { toastMsg.value = ''; }, 2000);
        };

        const copyText = async (text) => {
          try {
            await navigator.clipboard.writeText(text);
            showToast('コピーしました！');
          } catch (err) {
            alert('コピーに失敗しました。');
          }
        };

        const startEdit = (tpl) => {
          editingId.value = tpl.id;
          editForm.value = { ...tpl };
        };

        const cancelEdit = () => {
          if (editForm.value.isNew) {
            templates.value = templates.value.filter(t => t.id !== editForm.value.id);
          }
          editingId.value = null;
        };

        const saveEdit = () => {
          if(!editForm.value.title || !editForm.value.content) {
            alert("タイトルと本文を入力してください。");
            return;
          }
          const index = templates.value.findIndex(t => t.id === editForm.value.id);
          delete editForm.value.isNew;
          if (index !== -1) {
            templates.value[index] = { ...editForm.value };
          }
          saveToLocalStorage();
          editingId.value = null;
          showToast('保存しました');
        };

        const deleteTemplate = (index) => {
          if(confirm('このテンプレートを削除してもよろしいですか？')) {
            templates.value.splice(index, 1);
            saveToLocalStorage();
            editingId.value = null;
            showToast('削除しました');
          }
        };

        const addNewTemplate = () => {
          const newId = Date.now();
          const newTpl = { id: newId, title: '', content: '', isNew: true };
          templates.value.unshift(newTpl);
          startEdit(newTpl);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const saveToLocalStorage = () => {
          localStorage.setItem('mail_templates', JSON.stringify(templates.value));
        };

        return {
          templates, toastMsg, copyText,
          editingId, editForm, startEdit, cancelEdit, saveEdit,
          deleteTemplate, addNewTemplate
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
