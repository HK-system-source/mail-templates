<!-- グリッドを強制的に横3列にする (grid-cols-3) -->
<div class="grid grid-cols-3 gap-4">
  <div v-for="(tpl, index) in templates" :key="tpl.id" class="bg-white p-4 rounded shadow flex flex-col justify-between">
    
    <!-- 上部：タイトル ＋ 小さめのコピーボタン ＋ 編集ボタン をスッキリ配置 -->
    <div>
      <div class="flex items-center justify-between mb-2 gap-1">
        <h2 class="font-bold text-sm truncate">{{ tpl.title }}</h2>
        <div class="flex items-center gap-1 shrink-0">
          <!-- コンパクトなコピーボタン -->
          <button @click="copyText(tpl.content)" class="px-2 py-1 bg-blue-500 text-white text-xs rounded hover:bg-blue-600">
            コピー
          </button>
          <!-- 編集ボタン -->
          <button @click="startEdit(tpl)" class="px-2 py-1 bg-gray-200 text-gray-700 text-xs rounded hover:bg-gray-300">
            編集
          </button>
        </div>
      </div>
      
      <!-- 本文プレビューなど -->
      <p class="text-xs text-gray-600 whitespace-pre-wrap line-clamp-4">{{ tpl.content }}</p>
    </div>

  </div>
</div>
